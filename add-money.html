<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Money - Star Hub BD Shops</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#edf3ff;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#101828}.wrap{max-width:520px;margin:20px auto}.card{background:#fff;border:1px solid #dbeafe;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px #1e40af12}h1{font-size:23px;margin:4px 0 8px;color:#1d4ed8}.muted{color:#64748b;font-size:13px;line-height:1.6}.method{display:flex;gap:8px}.method button{flex:1;padding:12px 4px;border:1.5px solid #cbd5e1;border-radius:13px;background:#fff;font-weight:800;color:#334155}.method button.on{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.field{display:block;margin:14px 0 6px;font-size:13px;font-weight:800}.inp{width:100%;padding:13px;border:1.5px solid #cbd5e1;border-radius:12px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#2457db;color:white;font-size:16px;font-weight:800;margin-top:16px}.account{padding:12px;background:#eff6ff;border-radius:12px;color:#1e40af;font-weight:800}.msg{margin-top:12px;font-size:13px;line-height:1.6}.history{padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:13px}.back{color:#2457db;text-decoration:none;font-weight:700}
</style></head><body><main class="wrap"><p><a class="back" href="/">← ওয়েবসাইটে ফিরে যান</a></p><section class="card"><h1>ওয়ালেটে টাকা যোগ করুন</h1><p class="muted">নিচের নম্বরে Send Money করে তথ্য জমা দিন। Admin যাচাই না করা পর্যন্ত ব্যালেন্স যোগ হবে না।</p><div class="account">বিকাশ / নগদ / রকেট: 01863445965</div><label class="field">পেমেন্ট মাধ্যম</label><div class="method"><button type="button" class="on" data-method="বিকাশ">বিকাশ</button><button type="button" data-method="নগদ">নগদ</button><button type="button" data-method="রকেট">রকেট</button></div><form id="f"><label class="field" for="amount">টাকার পরিমাণ (৳)</label><input class="inp" id="amount" type="number" min="10" max="50000" required placeholder="যেমন ২০০"><label class="field" for="sender">যে নম্বর থেকে টাকা পাঠিয়েছেন</label><input class="inp" id="sender" inputmode="numeric" maxlength="11" required placeholder="01XXXXXXXXX"><label class="field" for="trx">Transaction ID</label><input class="inp" id="trx" maxlength="40" required placeholder="TrxID লিখুন"><button class="btn" id="submit">অনুরোধ জমা দিন</button><div class="msg" id="msg" role="status"></div></form></section><section class="card"><h3>আমার Add Money অনুরোধ</h3><div id="history" class="muted">লোড হচ্ছে…</div></section></main><script>
let method='বিকাশ';document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{method=b.dataset.method;document.querySelectorAll('[data-method]').forEach(x=>x.classList.toggle('on',x===b));});
async function load(){let r=await fetch('/api/auth/me',{cache:'no-store'}),j=await r.json();if(!j.loggedIn){location.href='/login?next='+encodeURIComponent('/add-money');return;}let h=await fetch('/api/wallet/history'),d=await h.json();document.getElementById('history').innerHTML=(d.requests||[]).map(x=>`<div class="history">৳${Number(x.amount).toFixed(2)} · ${x.method} · ${x.trx}<br>অবস্থা: ${x.status==='pending'?'যাচাই চলছে':x.status==='approved'?'অনুমোদিত':'বাতিল'} </div>`).join('')||'এখনো কোনো অনুরোধ নেই';}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('submit'),m=document.getElementById('msg');b.disabled=true;m.textContent='জমা হচ্ছে…';try{let r=await fetch('/api/wallet/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:document.getElementById('amount').value,method,sender:document.getElementById('sender').value,trx:document.getElementById('trx').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'সমস্যা হয়েছে');m.textContent=j.message;document.getElementById('f').reset();await load();}catch(e){m.textContent=e.message;}finally{b.disabled=false;}};load().catch(()=>{document.getElementById('history').textContent='তথ্য লোড করা যায়নি';});
</script></body></html>
