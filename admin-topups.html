<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Top-up Requests</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f1f5f9;margin:0;padding:18px;color:#0f172a}.wrap{max-width:800px;margin:20px auto}.card{background:white;border:1px solid #dbeafe;border-radius:18px;padding:18px;margin:12px 0}.inp{padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;margin:8px 0}.btn{padding:10px 14px;border:0;border-radius:9px;background:#2457db;color:#fff;font-weight:800;margin:5px}.no{background:#dc2626}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><h2>Admin · Add Money Requests</h2><section class="card" id="login"><p>Admin password দিয়ে প্রবেশ করুন</p><input class="inp" id="pw" type="password" placeholder="Admin password"><button class="btn" id="go">Login</button><div id="msg" class="muted"></div></section><section id="app" hidden><button class="btn" id="refresh">Refresh Requests</button><div id="items"></div></section></main><script>
let token='';const $=id=>document.getElementById(id);async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j;}
$('go').onclick=async()=>{try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;$('login').hidden=true;$('app').hidden=false;load();}catch(e){$('msg').textContent=e.message;}};
async function load(){try{let j=await api('/api/admin/topups');$('items').innerHTML='';(j.requests||[]).forEach(x=>{let d=document.createElement('section');d.className='card';d.innerHTML=`<b>৳${Number(x.amount).toFixed(2)} · ${x.method}</b><p>${x.name} (${x.identifier})</p><p>প্রেরক: ${x.sender}<br>TrxID: ${x.trx}<br>অবস্থা: ${x.status}<br>সময়: ${new Date(x.createdAt).toLocaleString('bn-BD')}</p>`;if(x.status==='pending'){let row=document.createElement('div');row.className='row';[['approve','Approve'],['reject','Reject']].forEach(([decision,label])=>{let b=document.createElement('button');b.className='btn '+(decision==='reject'?'no':'');b.textContent=label;b.onclick=async()=>{if(!confirm(label+' this request?'))return;try{await api('/api/admin/topups/decision',{method:'POST',body:JSON.stringify({userId:x.userId,requestId:x.id,decision})});load();}catch(e){alert(e.message)}};row.appendChild(b)});d.appendChild(row)}$('items').appendChild(d)});if(!$('items').children.length)$('items').textContent='কোনো অনুরোধ নেই';}catch(e){$('items').textContent=e.message;}}
$('refresh').onclick=load;
</script></body></html>
