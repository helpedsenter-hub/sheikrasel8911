<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Login / Register - Star Hub BD Shops</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eff6ff,#f8fafc);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#0f172a;display:grid;place-items:center;padding:18px}.card{width:100%;max-width:420px;background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:26px;box-shadow:0 18px 50px #1e40af18}.brand{text-align:center;margin-bottom:22px}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:grid;place-items:center;color:white;font-size:27px;margin:auto auto 12px}.brand h1{font-size:22px;margin:0}.brand p{color:#64748b;font-size:13px;margin:6px 0}.tabs{display:flex;background:#eff6ff;border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{width:50%;border:0;background:transparent;padding:11px;border-radius:9px;font-weight:800;color:#64748b}.tabs button.on{background:#2563eb;color:white}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;font-size:15px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.submit{width:100%;height:49px;border:0;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:15px;font-weight:800;margin-top:12px}.msg{font-size:13px;min-height:20px;margin:10px 0;color:#dc2626;text-align:center}.back{display:block;text-align:center;color:#2563eb;text-decoration:none;font-size:13px;margin-top:17px}.hint{color:#64748b;font-size:12px;text-align:center;line-height:1.6}
</style></head><body><main class="card"><div class="brand"><div class="logo">★</div><h1>Star Hub BD Shops</h1><p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p></div>
<div class="tabs"><button id="loginTab" class="on" type="button">লগইন</button><button id="regTab" type="button">রেজিস্ট্রেশন</button></div>
<form id="authForm"><div class="field" id="nameField" hidden><label for="name">আপনার নাম</label><input id="name" autocomplete="name" maxlength="60" placeholder="নাম লিখুন"></div>
<div class="field"><label for="identifier">মোবাইল নম্বর অথবা ইমেইল</label><input id="identifier" autocomplete="username" required placeholder="01XXXXXXXXX / email@example.com"></div>
<div class="field"><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="কমপক্ষে ৮ অক্ষর"></div>
<div class="msg" id="msg" role="alert"></div><button class="submit" id="submit" type="submit">লগইন করুন</button></form>
<p class="hint">রেজিস্ট্রেশনের জন্য OTP প্রয়োজন নেই। আপনার পাসওয়ার্ড কাউকে দেবেন না।</p><a class="back" href="/">← ওয়েবসাইটে ফিরে যান</a></main>
<script>
let mode='login';const $=id=>document.getElementById(id);
function setMode(m){mode=m;$('loginTab').classList.toggle('on',m==='login');$('regTab').classList.toggle('on',m==='register');$('nameField').hidden=m!=='register';$('name').required=m==='register';$('submit').textContent=m==='login'?'লগইন করুন':'অ্যাকাউন্ট খুলুন';$('password').autocomplete=m==='login'?'current-password':'new-password';$('msg').textContent='';}
$('loginTab').onclick=()=>setMode('login');$('regTab').onclick=()=>setMode('register');if(new URLSearchParams(location.search).get('mode')==='register')setMode('register');
$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='অপেক্ষা করুন…';$('msg').textContent='';
try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:$('name').value,identifier:$('identifier').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'সমস্যা হয়েছে');const n=new URLSearchParams(location.search).get('next');location.href=(n && n.startsWith('/') && !n.startsWith('//'))?n:'/profile';}
catch(err){$('msg').textContent=err.message;}finally{$('submit').disabled=false;$('submit').textContent=mode==='login'?'লগইন করুন':'অ্যাকাউন্ট খুলুন';}};
fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.loggedIn)const n=new URLSearchParams(location.search).get('next');location.href=(n && n.startsWith('/') && !n.startsWith('//'))?n:'/profile';}).catch(()=>{});
</script></body></html>
