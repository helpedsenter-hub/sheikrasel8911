<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমার অ্যাকাউন্ট - Star Hub BD Shops</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f1f5f9;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#0f172a}.wrap{max-width:520px;margin:30px auto}.card{background:white;border:1px solid #dbeafe;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px #1e40af0d}.top{text-align:center}.avatar{width:66px;height:66px;border-radius:22px;background:#2563eb;color:white;display:grid;place-items:center;font-size:28px;font-weight:800;margin:auto auto 12px}.muted{color:#64748b;font-size:13px}.balance{font-size:32px;font-weight:900;color:#1d4ed8;margin:7px 0}.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:14px;background:#2563eb;color:#fff;margin-top:10px;text-decoration:none;text-align:center}.btn.out{background:#fff;color:#dc2626;border:1px solid #fecaca}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:14px}.row:last-child{border:0}.note{font-size:12px;color:#64748b;line-height:1.7;margin-top:12px}
</style></head><body><main class="wrap"><section class="card top"><div class="avatar" id="avatar">★</div><h2 id="name">লোড হচ্ছে…</h2><div class="muted" id="identifier"></div><div class="balance">৳ <span id="balance">0.00</span></div><div class="muted">আমার ব্যালেন্স</div></section><section class="card"><h3>অ্যাকাউন্টের তথ্য</h3><div class="row"><span>নাম</span><b id="name2">—</b></div><div class="row"><span>মোবাইল / ইমেইল</span><b id="identifier2">—</b></div><div class="row"><span>অ্যাকাউন্ট খোলার তারিখ</span><b id="created">—</b></div><p class="note">ব্যালেন্স এখন নিরাপত্তার জন্য সার্ভার থেকে দেখানো হচ্ছে। পেমেন্ট যাচাই ছাড়া কোনো টাকা যোগ করা হবে না।</p><a class="btn" href="/">ওয়েবসাইটে ফিরে যান</a><button class="btn out" id="logout">লগআউট</button></section></main>
<script>
(async()=>{try{const r=await fetch('/api/auth/me',{cache:'no-store'});const j=await r.json();if(!j.loggedIn){location.href='/login';return;}const u=j.user;document.getElementById('name').textContent=u.name;document.getElementById('name2').textContent=u.name;document.getElementById('identifier').textContent=u.identifier;document.getElementById('identifier2').textContent=u.identifier;document.getElementById('balance').textContent=Number(u.balance||0).toFixed(2);document.getElementById('avatar').textContent=(u.name||'S').trim().charAt(0).toUpperCase();document.getElementById('created').textContent=new Date(u.createdAt).toLocaleDateString('bn-BD');}catch(e){location.href='/login';}})();
document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login';};
</script></body></html>
